
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy Lite</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background: #263238;
            color: white;
            padding: 25px;
        }

        .container {
            margin: 40px auto;
            padding: 25px;
            max-width: 600px;
            background: white;
            border-radius: 10px;
        }

        .product {
            padding: 15px;
            margin: 15px;
            background: #eeeeee;
            border-radius: 8px;
        }

        .version {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to ShopEasy Lite</h1>
        <p>Your simple online shopping destination</p>
    </header>

    <div class="container">
        <h2>Our Products</h2>

        <div class="product">
            <h3>Smartphone</h3>
            <p>Price: ₹15,000</p>
        </div>

        <div class="product">
            <h3>Headphones</h3>
            <p>Price: ₹2,000</p>
        </div>

        <div class="product">
            <h3>Smart Watch</h3>
            <p>Price: ₹3,500</p>
        </div>

        <p class="version">Deployment Version: 1.0</p>
    </div>

</body>
</html>
