
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy Lite - Version 2</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
            text-align: center;
        }

        header {
            background-color: #1565c0;
            color: white;
            padding: 25px;
        }

        .container {
            padding: 30px;
        }

        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .product {
            background-color: white;
            width: 220px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        button {
            background-color: #1565c0;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            margin-top: 30px;
            padding: 15px;
            background-color: #263238;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to ShopEasy Lite</h1>
        <p>Version 2 - A Better Shopping Experience</p>
    </header>

    <div class="container">

        <h2>Our Products</h2>

        <div class="products">

            <div class="product">
                <h3>Smartphone</h3>
                <p>Price: ₹15,000</p>
                <button>Buy Now</button>
            </div>

            <div class="product">
                <h3>Headphones</h3>
                <p>Price: ₹2,000</p>
                <button>Buy Now</button>
            </div>

            <div class="product">
                <h3>Smart Watch</h3>
                <p>Price: ₹3,500</p>
                <button>Buy Now</button>
            </div>

        </div>

        <h3>Deployment Version: 2.0</h3>

    </div>

    <footer>
        <p>ShopEasy Lite - Version 2</p>
    </footer>

</body>
</html>
